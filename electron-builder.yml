appId: page.osmosis.userscript-browser
productName: Userscript Browser
copyright: "Copyright 2026"

publish:
  provider: github
  owner: KUKARAF
  repo: userscript-electron
  releaseType: release

directories:
  output: dist

files:
  - out/**/*
  - package.json

mac:
  identity: null
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Network

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
