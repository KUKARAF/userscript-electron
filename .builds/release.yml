image: ubuntu/noble
packages:
  - curl
  - libgtk-3-0
  - libnotify4
  - libnss3
  - libxss1
  - libxtst6
  - libgbm1
  - libsecret-1-0
  - fuse
sources:
  - https://git.sr.ht/~burning_wipf/userscript-electron
tasks:
  - install-node: |
      curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
      sudo apt-get install -y nodejs
  - setup: |
      cd userscript-electron
      npm ci
  - build: |
      cd userscript-electron
      npm run build -- --publish never
      mv dist/Userscript\ Browser-*.AppImage dist/userscript-browser.AppImage
artifacts:
  - userscript-electron/dist/userscript-browser.AppImage
