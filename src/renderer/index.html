<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Userscript Browser</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="update-banner" class="update-banner hidden">
    <span id="update-banner-text"></span>
    <button id="btn-update-action" class="btn-primary btn-sm"></button>
    <button id="btn-update-dismiss" class="icon-btn" title="Dismiss">✕</button>
  </div>

  <nav id="navbar" class="navbar">
    <div class="traffic-light-spacer"></div>

    <div class="nav-controls">
      <button id="btn-back" class="nav-btn" title="Back" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <path d="M8.5 2L4 7l4.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
      <button id="btn-forward" class="nav-btn" title="Forward" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
          <path d="M5.5 2L10 7l-4.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </button>
      <button id="btn-reload" class="nav-btn" title="Reload">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M12 7A5 5 0 1 1 7 2a5 5 0 0 1 3.5 1.5L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 2v3h-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="nav-separator"></div>

    <div id="tab-strip" class="tab-strip"></div>

    <div id="page-title" class="page-title"></div>

    <div class="right-controls">
      <button id="btn-request-script" class="nav-btn" title="Request Userscript">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 1v2M7.5 12v2M1 7.5h2M12 7.5h2M3.1 3.1l1.4 1.4M10.5 10.5l1.4 1.4M3.1 11.9l1.4-1.4M10.5 4.5l1.4-1.4"/>
          <circle cx="7.5" cy="7.5" r="2.5"/>
        </svg>
      </button>
      <button id="btn-report-issue" class="nav-btn" title="Report Issue">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.5" cy="7.5" r="6.5"/>
          <path d="M7.5 4v3M7.5 10h.01"/>
        </svg>
      </button>
      <button id="btn-settings" class="nav-btn settings-btn" title="Settings">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor">
          <path d="M7.5 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M6.065 1a1 1 0 0 0-.97.757l-.272 1.083a5.5 5.5 0 0 0-.874.505l-1.07-.358a1 1 0 0 0-1.166.467l-.94 1.628a1 1 0 0 0 .201 1.24l.822.737a5.57 5.57 0 0 0 0 1.01l-.822.737a1 1 0 0 0-.2 1.24l.939 1.628a1 1 0 0 0 1.165.467l1.071-.358c.274.19.565.362.873.505l.273 1.083A1 1 0 0 0 6.065 14h2.87a1 1 0 0 0 .97-.757l.273-1.083a5.5 5.5 0 0 0 .873-.505l1.071.358a1 1 0 0 0 1.165-.467l.94-1.628a1 1 0 0 0-.201-1.24l-.822-.737a5.574 5.574 0 0 0 0-1.01l.822-.737a1 1 0 0 0 .2-1.24l-.939-1.628a1 1 0 0 0-1.165-.467l-1.071.358a5.5 5.5 0 0 0-.873-.505L9.904 1.757A1 1 0 0 0 8.935 1H6.065Zm-.578 2.25.21-.812h3.606l.21.812a1 1 0 0 0 .613.674 4.005 4.005 0 0 1 1.205.697 1 1 0 0 0 .913.19l.823-.275.724 1.254-.632.567a1 1 0 0 0-.31.893 4.073 4.073 0 0 1 0 1.478 1 1 0 0 0 .31.893l.632.567-.724 1.254-.823-.275a1 1 0 0 0-.913.19 4.006 4.006 0 0 1-1.205.698 1 1 0 0 0-.613.673l-.21.812H5.697l-.21-.812a1 1 0 0 0-.613-.673 4.005 4.005 0 0 1-1.205-.698 1 1 0 0 0-.913-.19l-.822.275-.724-1.254.631-.567a1 1 0 0 0 .31-.893 4.074 4.074 0 0 1 0-1.478 1 1 0 0 0-.31-.893l-.631-.567.724-1.254.822.275a1 1 0 0 0 .913-.19 4.006 4.006 0 0 1 1.205-.697 1 1 0 0 0 .613-.674Z"/>
        </svg>
      </button>
    </div>
  </nav>

  <div id="webview-container"></div>

  <div id="request-panel" class="request-panel hidden">
    <div class="request-header">
      <h2>Request Userscript</h2>
      <button id="btn-close-request" class="icon-btn" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="request-body">
      <p id="request-url-label" class="request-url-label"></p>
      <textarea id="input-prompt" class="prompt-textarea" placeholder="Describe what you want the script to do…" rows="5"></textarea>
      <button id="btn-submit-request" class="btn-primary">Request Script</button>
      <div id="task-status-area" class="task-status-area hidden"></div>
      <div id="active-scripts-section" class="active-scripts-section hidden">
        <div class="active-scripts-label">Active on this page</div>
        <div id="active-scripts-list" class="active-scripts-list"></div>
      </div>
    </div>
  </div>

  <div id="issue-panel" class="issue-panel hidden">
    <div class="issue-header">
      <h2>Report Page Error</h2>
      <button id="btn-close-issue" class="icon-btn" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="issue-body">
      <p class="settings-hint">Captures the current page's HTML and sends it to the server for debugging.</p>
      <p class="settings-hint" style="word-break:break-all;"><strong id="issue-page-url"></strong></p>
      <div id="issue-status" class="issue-status hidden"></div>
      <button id="btn-submit-issue" class="btn-primary">Send Report</button>
    </div>
  </div>

  <div id="settings-panel" class="settings-panel hidden">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="btn-close-settings" class="icon-btn" title="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor">
          <path d="M1 1l10 10M11 1 1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">
      <section class="settings-section">
        <h3>API Token</h3>
        <p class="settings-hint">Required for requesting userscripts from userscripts.osmosis.page</p>
        <div class="input-row">
          <input id="input-api-token" type="password" placeholder="egghead_..." autocomplete="off" spellcheck="false">
          <button id="btn-save-token" class="btn-primary">Save</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>Installed Scripts</h3>
        <div id="scripts-list" class="scripts-list">
          <p class="settings-hint">No scripts installed yet.</p>
        </div>
        <button id="btn-check-scripts" class="btn-secondary">Check for Updates</button>
      </section>

      <section class="settings-section">
        <h3>Pages</h3>
        <div id="pages-list" class="pages-list"></div>
        <div id="add-page-form" style="display:flex;gap:6px;margin-top:6px;">
          <input id="add-page-input" type="text" placeholder="https://..." style="flex:1;display:none;" />
          <button id="btn-add-page" class="btn-secondary">+ Add Page</button>
          <button id="btn-add-page-confirm" class="btn-secondary" style="display:none;">Add</button>
          <button id="btn-add-page-cancel" class="btn-secondary" style="display:none;">✕</button>
        </div>
      </section>
    </div>
    <div class="settings-footer">
      <span id="app-version" class="version-label"></span>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
